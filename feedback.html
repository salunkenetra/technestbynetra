<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Feedback - TechNest by Netra</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <div class="logo">
            TechNest by Netra
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Me</a>
            <a href="contact.html">Contact Us</a>
            <a href="feedback.html">Feedback</a>
        </nav>

    </header>


    <div class="content">

        <span class="welcome">YOUR FEEDBACK</span>

        <h1>Feedback</h1>

        <h2>Share Your Thoughts</h2>

        <p>
            I would love to know what you think about my website.
            Your feedback will help me improve my skills and
            create better projects in the future.
        </p>

        <form action="thankyou.html" method="get">

            <p>
                <label for="name">Your Name:</label>
            </p>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required
            >

            <p>
                <label for="email">Your Email:</label>
            </p>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <p>
                <label for="message">Your Feedback:</label>
            </p>

            <textarea
                id="message"
                name="message"
                rows="5"
                placeholder="Write your feedback here..."
                required
            ></textarea>

            <br><br>

            <button type="submit" class="btn">
                Submit Feedback
            </button>

        </form>

    </div>


    <footer>

        <p>
            Designed & Developed by
            <strong>Netra Mangesh Salunke</strong>
        </p>

    </footer>

</body>

</html>
